version: '3.8'

services:
  shapelog-db:
    image: postgres:15-alpine
    container_name: shapelog-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - shapelog_pgdata:/var/lib/postgresql/data
    networks:
      - shapelog-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  shapelog-bot:
    image: saviomarques/shapelog-bot:latest
    container_name: shapelog-bot
    restart: unless-stopped
    depends_on:
      shapelog-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json:ro
    networks:
      - shapelog-net
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: shapelog-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - shapelog-net
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: shapelog-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - shapelog-net
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  shapelog_pgdata:
  prometheus_data:
  grafana_data:

networks:
  shapelog-net:

