name: CI-CD Build Test Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Rodar testes
        run: |
          chmod +x mvnw
          ./mvnw test --batch-mode

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shapelog-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shapelog-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS OCI
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: SSH Pull e Restart na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /home/ubuntu/shapelog-bot
            COMPOSE_CMD="docker compose"
            if ! docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            fi
            $COMPOSE_CMD pull shapelog-bot
            $COMPOSE_CMD up -d --no-build
            docker image prune -f
            echo "Deploy concluido! Bot esta online."
