# Banco de Dados da VPS (Container Postgres shapelog-db)
spring.datasource.url=${DB_URL:jdbc:postgresql://shapelog-db:5432/shapelog}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

logging.level.com.bot.telegram=INFO
logging.level.org.hibernate.SQL=WARN
