spring.application.name=telegram
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.threads.virtual.enabled=true

# Telegram Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.admin-id=${TELEGRAM_BOT_ADMIN_ID:0}

# ShapeLog Domain & Rate Limit Configuration
shapelog.timezone=${SHAPELOG_TIMEZONE:America/Sao_Paulo}
shapelog.ratelimit.ai-per-minute=${SHAPELOG_RATELIMIT_AI_PER_MINUTE:5}
shapelog.ratelimit.ai-per-hour=${SHAPELOG_RATELIMIT_AI_PER_HOUR:30}

# JPA & Database Configuration Fallback
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://shapelog-db:5432/shapelog}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:shapelog_user}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Spring AI Google GenAI (Google AI Studio)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.2

# Spring AI Retry Configuration
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

# Monitoring (Actuator + Prometheus)
server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=shapelog-bot
