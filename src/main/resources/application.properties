spring.application.name=telegram
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Telegram Configuration
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.admin-id=${TELEGRAM_BOT_ADMIN_ID:0}

# JPA & Database Configuration Fallback
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://shapelog-db:5432/shapelog}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:shapelog_user}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:shapelog_user}}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Spring AI Google GenAI (Google AI Studio)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.2

# Spring AI Retry Configuration
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

# Monitoring (Actuator + Prometheus)
server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=shapelog-bot

