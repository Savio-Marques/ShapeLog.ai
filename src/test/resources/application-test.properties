# Configuração do H2 Database em memória para execução de testes
spring.datasource.url=jdbc:h2:mem:shapelog_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

telegram.bot.username=test_bot
telegram.bot.token=test_token
telegram.bot.admin-id=999999

spring.ai.vertex.ai.gemini.project-id=test-project
spring.ai.vertex.ai.gemini.location=us-central1
