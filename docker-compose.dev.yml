services:
  shapelog-dev-db:
    image: postgres:15-alpine
    container_name: shapelog-dev-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shapelog_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - shapelog_dev_pgdata:/var/lib/postgresql/data

volumes:
  shapelog_dev_pgdata:
